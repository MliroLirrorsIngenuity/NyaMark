name: Test

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - "**"

jobs:
  ts-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun x tsc

  build-test:
    needs: ts-check
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
          - name: Windows ARM64
            platform: windows-latest
            args: "--target aarch64-pc-windows-msvc"
          - name: macOS x64
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
          - name: Linux ARM64
            platform: ubuntu-24.04-arm
            args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ (matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin') || (matrix.name == 'Windows ARM64' && 'aarch64-pc-windows-msvc') || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Build test
        run: bun tauri build ${{ matrix.args }}

      - name: Collect release assets
        shell: bash
        env:
          MATRIX_ARGS: "${{ matrix.args }}"
        run: |
          set -euo pipefail

          TARGET_TRIPLE=""
          if [[ "$MATRIX_ARGS" =~ --target[[:space:]]+([^[:space:]]+) ]]; then
            TARGET_TRIPLE="${BASH_REMATCH[1]}"
          fi

          BASE_DIR="src-tauri/target/release"
          if [ -n "$TARGET_TRIPLE" ]; then
            BASE_DIR="src-tauri/target/$TARGET_TRIPLE/release"
          fi

          mkdir -p upload_dist

          case "${{ runner.os }}" in
            Linux)
              find "$BASE_DIR/bundle/appimage" -maxdepth 1 -type f \( -name "*.AppImage" -o -name "*.AppImage.sig" \) -exec cp {} upload_dist/ \; 2>/dev/null || true
              find "$BASE_DIR/bundle/deb" -maxdepth 1 -type f \( -name "*.deb" -o -name "*.deb.sig" \) -exec cp {} upload_dist/ \; 2>/dev/null || true
              find "$BASE_DIR/bundle/rpm" -maxdepth 1 -type f \( -name "*.rpm" -o -name "*.rpm.sig" \) -exec cp {} upload_dist/ \; 2>/dev/null || true
              ;;
            macOS)
              find "$BASE_DIR/bundle/dmg" -maxdepth 1 -type f -name "*.dmg" -exec cp {} upload_dist/ \; 2>/dev/null || true
              find "$BASE_DIR/bundle/macos" -maxdepth 1 -type f \( -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \) -exec cp {} upload_dist/ \; 2>/dev/null || true
              ;;
            Windows)
              find "$BASE_DIR/bundle/nsis" -maxdepth 1 -type f \( -name "*.exe" -o -name "*.exe.sig" \) -exec cp {} upload_dist/ \; 2>/dev/null || true
              ;;
            *)
              echo "Unsupported runner OS: ${{ runner.os }}"
              ;;
          esac

          ls -la upload_dist || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}-${{ github.run_number }}
          path: |
            upload_dist/**
          if-no-files-found: warn
          retention-days: 14
