name: Release
run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v1.0.0-beta.1."
        required: true
        default: "v1.0.0-beta.1"
        type: string

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  preparation:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_version.outputs.tag }}
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
      ref: ${{ steps.get_version.outputs.ref }}
      changelog: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version info
        id: get_version
        shell: bash
        env:
          # Through the environment, never spliced into the script: the
          # dispatch input is free text.
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Release tags look like v1.2.3 or v1.2.3-beta.1, got: $TAG_NAME"
            exit 1
          fi
          VERSION=${TAG_NAME#v}
          IS_PRERELEASE=false
          if [[ $VERSION == *"-"* ]]; then
            IS_PRERELEASE=true
          fi
          # An existing tag is released as tagged; a dispatch for a new tag
          # releases the dispatched commit, and the tag is created there.
          if REF=$(git rev-parse -q --verify "refs/tags/$TAG_NAME^{commit}"); then
            CLIFF_ARGS="--current"
          else
            REF="$GITHUB_SHA"
            CLIFF_ARGS="--unreleased --tag $TAG_NAME"
          fi
          git checkout -q "$REF"
          {
            echo "tag=$TAG_NAME"
            echo "version=$VERSION"
            echo "is_prerelease=$IS_PRERELEASE"
            echo "ref=$REF"
            echo "cliff_args=$CLIFF_ARGS"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Changelog (Latest)
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          args: ${{ steps.get_version.outputs.cliff_args }} --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The release commit can be behind main (or not on it at all), so the
      # entry is added on top of main itself rather than pushed from here.
      - name: Add the release to CHANGELOG.md on main
        shell: bash
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          NOTES: ${{ steps.git-cliff.outputs.content }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main
          git checkout -q -B changelog origin/main
          # Anchor the heading and escape the dots, so "## 1.0.0" is not
          # satisfied by an existing "## 1.0.0-beta.4" entry.
          if grep -qE "^## \[?${VERSION//./\\.}\]?( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md already has $VERSION"
            exit 0
          fi
          { head -n 1 CHANGELOG.md; printf '%s\n' "$NOTES"; tail -n +2 CHANGELOG.md; } > CHANGELOG.next
          mv CHANGELOG.next CHANGELOG.md
          git commit -q -am "chore: update CHANGELOG.md [skip ci]"
          for attempt in 1 2 3; do
            if git push -q origin HEAD:main; then exit 0; fi
            git pull -q --rebase origin main
          done
          echo "Could not push CHANGELOG.md to main"
          exit 1

  build:
    name: Build ${{ matrix.name }}
    needs: preparation
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
            target: ""
            updater_key: windows-x86_64
          - name: Windows ARM64
            platform: windows-latest
            args: "--target aarch64-pc-windows-msvc"
            target: aarch64-pc-windows-msvc
            updater_key: windows-aarch64
          - name: macOS x64
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
            updater_key: darwin-x86_64
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
            updater_key: darwin-aarch64
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
            target: ""
            updater_key: linux-x86_64
          - name: Linux ARM64
            platform: ubuntu-24.04-arm
            args: ""
            target: ""
            updater_key: linux-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preparation.outputs.ref }}

      - name: Update Version in files
        shell: bash
        env:
          VERSION: ${{ needs.preparation.outputs.version }}
          IS_PRERELEASE: ${{ needs.preparation.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          # tauri.conf.json takes its version from package.json.
          npm pkg set version="$VERSION"
          # Only the [package] table's version, never a dependency's.
          perl -0pi -e 's/(\[package\][^\[]*?\nversion = )"[^"]*"/${1}"$ENV{VERSION}"/' src-tauri/Cargo.toml
          grep -qx "version = \"$VERSION\"" src-tauri/Cargo.toml
          # `releases/latest` only ever resolves to a stable release, so
          # pre-release builds follow the rolling `updater-beta` feed instead
          # (see "Publish updater feed" below). Stable builds keep the default.
          if [ "$IS_PRERELEASE" = "true" ]; then
            perl -i -pe 's#releases/latest/download/latest\.json#releases/download/updater-beta/latest.json#' src-tauri/tauri.conf.json
            grep -q "updater-beta/latest.json" src-tauri/tauri.conf.json
          fi

      - name: Install Linux dependencies
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ (matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin') || (matrix.name == 'Windows ARM64' && 'aarch64-pc-windows-msvc') || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Sync Cargo.lock with the new version
        working-directory: src-tauri
        run: cargo update --workspace

      - name: Build release assets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun tauri build ${{ matrix.args }}

      - name: Collect release assets
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          UPDATER_KEY: ${{ matrix.updater_key }}
        run: |
          set -euo pipefail

          BASE_DIR="src-tauri/target/release"
          if [ -n "$TARGET_TRIPLE" ]; then
            BASE_DIR="src-tauri/target/$TARGET_TRIPLE/release"
          fi

          mkdir -p upload_dist updater_metadata

          case "${{ runner.os }}" in
            Linux)
              find "$BASE_DIR/bundle/appimage" -maxdepth 1 -type f \( -name "*.AppImage" -o -name "*.AppImage.sig" \) -exec cp {} upload_dist/ \; 2>/dev/null || true
              find "$BASE_DIR/bundle/deb" -maxdepth 1 -type f \( -name "*.deb" -o -name "*.deb.sig" \) -exec cp {} upload_dist/ \; 2>/dev/null || true
              find "$BASE_DIR/bundle/rpm" -maxdepth 1 -type f \( -name "*.rpm" -o -name "*.rpm.sig" \) -exec cp {} upload_dist/ \; 2>/dev/null || true
              UPDATE_ASSET=$(find upload_dist -maxdepth 1 -type f -name "*.AppImage" | head -n 1)
              ;;
            macOS)
              find "$BASE_DIR/bundle/dmg" -maxdepth 1 -type f -name "*.dmg" -exec cp {} upload_dist/ \; 2>/dev/null || true
              # Both Macs build a NyaMark.app.tar.gz: named for its platform, or
              # one would replace the other in the release and in latest.json.
              for file in "$BASE_DIR"/bundle/macos/*.app.tar.gz "$BASE_DIR"/bundle/macos/*.app.tar.gz.sig; do
                [ -f "$file" ] || continue
                name=$(basename "$file")
                cp "$file" "upload_dist/${name%%.app.tar.gz*}_${UPDATER_KEY}.app.tar.gz${name##*.app.tar.gz}"
              done
              UPDATE_ASSET=$(find upload_dist -maxdepth 1 -type f -name "*.app.tar.gz" | head -n 1)
              ;;
            Windows)
              find "$BASE_DIR/bundle/nsis" -maxdepth 1 -type f \( -name "*.exe" -o -name "*.exe.sig" \) -exec cp {} upload_dist/ \; 2>/dev/null || true
              UPDATE_ASSET=$(find upload_dist -maxdepth 1 -type f -name "*.exe" | head -n 1)
              ;;
            *)
              echo "Unsupported runner OS: ${{ runner.os }}"
              exit 1
              ;;
          esac

          ls -la upload_dist

          if ! find upload_dist -mindepth 1 -maxdepth 1 | grep -q .; then
            echo "No release assets found in $BASE_DIR"
            exit 1
          fi

          # Every matrix entry feeds one updater platform; a missing bundle or
          # signature would silently drop that platform from latest.json.
          if [ -z "${UPDATE_ASSET:-}" ]; then
            echo "No updater bundle found for $UPDATER_KEY in $BASE_DIR"
            exit 1
          fi
          if [ ! -f "${UPDATE_ASSET}.sig" ]; then
            echo "Missing updater signature ${UPDATE_ASSET}.sig (is TAURI_SIGNING_PRIVATE_KEY set?)"
            exit 1
          fi
          printf '%s\n' "$(basename "$UPDATE_ASSET")" > "updater_metadata/${UPDATER_KEY}.txt"

      - name: Upload bundled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.updater_key }}
          if-no-files-found: error
          retention-days: 1
          path: |
            upload_dist/**
            updater_metadata/**

  publish:
    name: Publish release assets
    needs:
      - preparation
      - build
    runs-on: ubuntu-latest
    env:
      # This job never checks out the repository, so gh cannot infer the repo from git.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download bundled artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: collected_artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.preparation.outputs.tag }}
          RELEASE_NAME: NyaMark ${{ needs.preparation.outputs.tag }}
          RELEASE_BODY: ${{ needs.preparation.outputs.changelog }}
          IS_PRERELEASE: ${{ needs.preparation.outputs.is_prerelease }}
          TARGET_COMMITISH: ${{ needs.preparation.outputs.ref }}
        run: |
          set -euo pipefail

          # Download badges above the changes: a row for each system, its
          # installers side by side, each linked to its file in this release.
          DIST=collected_artifacts/upload_dist
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}"
          badge() {
            local pattern=$1 label=$2 message=$3 color=$4 logo=${5:-} file
            file=$(cd "$DIST" && compgen -G "$pattern" | head -n 1 || true)
            if [ -z "$file" ]; then
              echo "$pattern" >> missing_installers.txt
              return
            fi
            printf '[![%s %s](https://img.shields.io/badge/%s-%s-%s%s)](%s/%s) ' \
              "$label" "$message" "${label// /%20}" "${message// /%20}" "$color" \
              "${logo:+?logo=$logo&logoColor=white}" "$BASE_URL" "$file"
          }
          {
            echo "## Download"
            echo
            echo "| System | Installers |"
            echo "| --- | --- |"
            echo "| Windows | $(badge '*_x64-setup.exe' Setup x64 0078D4)$(badge '*_arm64-setup.exe' Setup ARM64 005A9E) |"
            echo "| macOS | $(badge '*_aarch64.dmg' DMG 'Apple Silicon' 000000 apple)$(badge '*_x64.dmg' DMG Intel 1E9BD7 apple) |"
            echo "| Linux | $(badge '*_amd64.AppImage' AppImage x64 E95420 linux)$(badge '*_aarch64.AppImage' AppImage ARM64 E95420 linux)$(badge '*_amd64.deb' Deb x64 D70A53 debian)$(badge '*_arm64.deb' Deb ARM64 D70A53 debian)$(badge '*.x86_64.rpm' RPM x64 CC8800 redhat)$(badge '*.aarch64.rpm' RPM ARM64 CC8800 redhat) |"
            echo
            printf '%s' "$RELEASE_BODY"
          } > release_notes.md
          cat release_notes.md
          echo
          if [ -f missing_installers.txt ]; then
            while read -r pattern; do
              echo "::warning::No installer matches $pattern"
            done < missing_installers.txt
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            if [ "$IS_PRERELEASE" = "true" ]; then
              gh release edit "$TAG_NAME" --title "$RELEASE_NAME" --notes-file release_notes.md --prerelease
            else
              gh release edit "$TAG_NAME" --title "$RELEASE_NAME" --notes-file release_notes.md
            fi
          else
            if [ "$IS_PRERELEASE" = "true" ]; then
              gh release create "$TAG_NAME" --target "$TARGET_COMMITISH" --title "$RELEASE_NAME" --notes-file release_notes.md --prerelease
            else
              gh release create "$TAG_NAME" --target "$TARGET_COMMITISH" --title "$RELEASE_NAME" --notes-file release_notes.md
            fi
          fi

      - name: Upload release bundle files
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.preparation.outputs.tag }}
        run: |
          set -euo pipefail
          ls -la collected_artifacts/upload_dist
          gh release upload "$TAG_NAME" collected_artifacts/upload_dist/* --clobber

      - name: Generate latest.json
        shell: bash
        env:
          TAG_NAME: ${{ needs.preparation.outputs.tag }}
          VERSION: ${{ needs.preparation.outputs.version }}
          RELEASE_BODY: ${{ needs.preparation.outputs.changelog }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$RELEASE_BODY" \
            --arg pub_date "$PUB_DATE" \
            '{version:$version,notes:$notes,pub_date:$pub_date,platforms:{}}' > latest.json

          for meta in collected_artifacts/updater_metadata/*.txt; do
            [ -f "$meta" ] || continue

            PLATFORM_KEY=$(basename "$meta" .txt)
            ASSET_NAME=$(tr -d '\r\n' < "$meta")
            SIGNATURE_FILE="collected_artifacts/upload_dist/${ASSET_NAME}.sig"

            if [ ! -f "$SIGNATURE_FILE" ]; then
              echo "Missing updater signature for $ASSET_NAME"
              exit 1
            fi

            SIGNATURE=$(tr -d '\r\n' < "$SIGNATURE_FILE")
            ASSET_URL="https://github.com/${REPOSITORY}/releases/download/${TAG_NAME}/${ASSET_NAME}"
            TMP_JSON=$(mktemp)

            jq \
              --arg platform "$PLATFORM_KEY" \
              --arg url "$ASSET_URL" \
              --arg signature "$SIGNATURE" \
              '.platforms[$platform] = { url: $url, signature: $signature }' \
              latest.json > "$TMP_JSON"

            mv "$TMP_JSON" latest.json
          done

          # Each matrix entry must have contributed, otherwise one platform
          # would silently stop receiving updates.
          for platform in windows-x86_64 windows-aarch64 darwin-x86_64 darwin-aarch64 linux-x86_64 linux-aarch64; do
            if ! jq -e --arg platform "$platform" '.platforms[$platform]' latest.json >/dev/null; then
              echo "latest.json is missing platform $platform"
              exit 1
            fi
          done
          jq . latest.json

      - name: Upload latest.json
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.preparation.outputs.tag }}
        run: gh release upload "$TAG_NAME" latest.json --clobber

      # Stable builds poll `releases/latest/download/latest.json`, which GitHub
      # keeps pointing at the newest stable release. Pre-release builds poll a
      # rolling `updater-beta` release that always carries the newest release
      # of either kind, so beta users are moved to the next stable as well.
      - name: Publish updater feed for pre-release builds
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED_TAG: updater-beta
          TARGET_COMMITISH: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! gh release view "$FEED_TAG" >/dev/null 2>&1; then
            gh release create "$FEED_TAG" --target "$TARGET_COMMITISH" --prerelease \
              --title "Updater feed (beta channel)" \
              --notes "Rolling metadata consumed by pre-release builds of NyaMark. Not a release; install from the versioned releases."
          fi
          gh release upload "$FEED_TAG" latest.json --clobber
