name: Release
run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v1.0.0-beta.1."
        required: true
        default: "v1.0.0-beta.1"
        type: string

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  preparation:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_version.outputs.tag }}
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
      changelog: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version info
        id: get_version
        shell: bash
        run: |
          TAG_NAME=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          VERSION=${TAG_NAME#v}
          IS_PRERELEASE=false
          if [[ $VERSION == *"-"* ]]; then
            IS_PRERELEASE=true
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Generate Changelog (Latest)
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if version already exists in CHANGELOG.md
        id: check_changelog
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if grep -q "## $VERSION" CHANGELOG.md; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Update CHANGELOG.md (Prepend)
        if: github.event_name != 'workflow_dispatch' && steps.check_changelog.outputs.exists == 'false'
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --latest --prepend CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push CHANGELOG.md
        if: github.event_name != 'workflow_dispatch' && steps.check_changelog.outputs.exists == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: update CHANGELOG.md [skip ci]"
            git push origin HEAD:main
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: preparation
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
          - name: Windows ARM64
            platform: windows-latest
            args: "--target aarch64-pc-windows-msvc"
          - name: macOS x64
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
          - name: Linux ARM64
            platform: ubuntu-24.04-arm
            args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update Version in files
        shell: bash
        run: |
          VERSION="${{ needs.preparation.outputs.version }}"
          perl -i -pe "s/\"version\": \".*?\"/\"version\": \"$VERSION\"/" package.json
          perl -i -pe "s/^version = \".*?\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Install Linux dependencies
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ (matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin') || (matrix.name == 'Windows ARM64' && 'aarch64-pc-windows-msvc') || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.preparation.outputs.tag }}
          releaseName: NyaMark ${{ needs.preparation.outputs.tag }}
          releaseBody: ${{ needs.preparation.outputs.changelog }}
          releaseDraft: false
          prerelease: ${{ needs.preparation.outputs.is_prerelease }}
          tauriScript: bun tauri
          releaseAssetNamePattern: "[name]_[version]_[platform]_[arch][setup][ext]"
          args: ${{ matrix.args }}
