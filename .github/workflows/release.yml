name: Release
run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v1.0.0-beta.1."
        required: true
        default: "v1.0.0-beta.1"
        type: string

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  preparation:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_version.outputs.tag }}
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
      changelog: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version info
        id: get_version
        shell: bash
        run: |
          TAG_NAME=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          VERSION=${TAG_NAME#v}
          IS_PRERELEASE=false
          if [[ $VERSION == *"-"* ]]; then
            IS_PRERELEASE=true
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Generate Changelog (Latest)
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if version already exists in CHANGELOG.md
        id: check_changelog
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if grep -q "## $VERSION" CHANGELOG.md; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Update CHANGELOG.md (Prepend)
        if: github.event_name != 'workflow_dispatch' && steps.check_changelog.outputs.exists == 'false'
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --latest --prepend CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push CHANGELOG.md
        if: github.event_name != 'workflow_dispatch' && steps.check_changelog.outputs.exists == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: update CHANGELOG.md [skip ci]"
            git push origin HEAD:main
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: preparation
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
            target: ""
            updater_key: windows-x86_64
          - name: Windows ARM64
            platform: windows-latest
            args: "--target aarch64-pc-windows-msvc"
            target: aarch64-pc-windows-msvc
            updater_key: windows-aarch64
          - name: macOS x64
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
            updater_key: darwin-x86_64
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
            updater_key: darwin-aarch64
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
            target: ""
            updater_key: linux-x86_64
          - name: Linux ARM64
            platform: ubuntu-24.04-arm
            args: ""
            target: ""
            updater_key: linux-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update Version in files
        shell: bash
        run: |
          VERSION="${{ needs.preparation.outputs.version }}"
          perl -i -pe "s/\"version\": \".*?\"/\"version\": \"$VERSION\"/" package.json
          perl -i -pe "s/^version = \".*?\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Install Linux dependencies
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ (matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin') || (matrix.name == 'Windows ARM64' && 'aarch64-pc-windows-msvc') || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Build release assets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun tauri build ${{ matrix.args }}

      - name: Collect release assets
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          UPDATER_KEY: ${{ matrix.updater_key }}
        run: |
          set -euo pipefail

          BASE_DIR="src-tauri/target/release"
          if [ -n "$TARGET_TRIPLE" ]; then
            BASE_DIR="src-tauri/target/$TARGET_TRIPLE/release"
          fi

          mkdir -p upload_dist updater_metadata

          case "${{ runner.os }}" in
            Linux)
              find "$BASE_DIR/bundle/appimage" -maxdepth 1 -type f \( -name "*.AppImage" -o -name "*.AppImage.sig" \) -exec cp {} upload_dist/ \; 2>/dev/null || true
              find "$BASE_DIR/bundle/deb" -maxdepth 1 -type f \( -name "*.deb" -o -name "*.deb.sig" \) -exec cp {} upload_dist/ \; 2>/dev/null || true
              find "$BASE_DIR/bundle/rpm" -maxdepth 1 -type f \( -name "*.rpm" -o -name "*.rpm.sig" \) -exec cp {} upload_dist/ \; 2>/dev/null || true
              UPDATE_ASSET=$(find upload_dist -maxdepth 1 -type f -name "*.AppImage" | head -n 1)
              ;;
            macOS)
              find "$BASE_DIR/bundle/dmg" -maxdepth 1 -type f -name "*.dmg" -exec cp {} upload_dist/ \; 2>/dev/null || true
              find "$BASE_DIR/bundle/macos" -maxdepth 1 -type f \( -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \) -exec cp {} upload_dist/ \; 2>/dev/null || true
              UPDATE_ASSET=$(find upload_dist -maxdepth 1 -type f -name "*.app.tar.gz" | head -n 1)
              ;;
            Windows)
              find "$BASE_DIR/bundle/nsis" -maxdepth 1 -type f \( -name "*.exe" -o -name "*.exe.sig" \) -exec cp {} upload_dist/ \; 2>/dev/null || true
              UPDATE_ASSET=$(find upload_dist -maxdepth 1 -type f -name "*.exe" | head -n 1)
              ;;
            *)
              echo "Unsupported runner OS: ${{ runner.os }}"
              exit 1
              ;;
          esac

          ls -la upload_dist

          if ! find upload_dist -mindepth 1 -maxdepth 1 | grep -q .; then
            echo "No release assets found in $BASE_DIR"
            exit 1
          fi

          if [ -n "${UPDATE_ASSET:-}" ] && [ -f "${UPDATE_ASSET}.sig" ]; then
            printf '%s\n' "$(basename "$UPDATE_ASSET")" > "updater_metadata/${UPDATER_KEY}.txt"
          fi

      - name: Upload bundled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.updater_key }}
          if-no-files-found: error
          retention-days: 1
          path: |
            upload_dist/**
            updater_metadata/**

  publish:
    name: Publish release assets
    needs:
      - preparation
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download bundled artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: collected_artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.preparation.outputs.tag }}
          RELEASE_NAME: NyaMark ${{ needs.preparation.outputs.tag }}
          RELEASE_BODY: ${{ needs.preparation.outputs.changelog }}
          IS_PRERELEASE: ${{ needs.preparation.outputs.is_prerelease }}
          TARGET_COMMITISH: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_BODY" > release_notes.md

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            if [ "$IS_PRERELEASE" = "true" ]; then
              gh release edit "$TAG_NAME" --title "$RELEASE_NAME" --notes-file release_notes.md --prerelease
            else
              gh release edit "$TAG_NAME" --title "$RELEASE_NAME" --notes-file release_notes.md
            fi
          else
            if [ "$IS_PRERELEASE" = "true" ]; then
              gh release create "$TAG_NAME" --target "$TARGET_COMMITISH" --title "$RELEASE_NAME" --notes-file release_notes.md --prerelease
            else
              gh release create "$TAG_NAME" --target "$TARGET_COMMITISH" --title "$RELEASE_NAME" --notes-file release_notes.md
            fi
          fi

      - name: Upload release bundle files
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.preparation.outputs.tag }}
        run: |
          set -euo pipefail
          ls -la collected_artifacts/upload_dist
          gh release upload "$TAG_NAME" collected_artifacts/upload_dist/* --clobber

      - name: Generate latest.json
        if: needs.preparation.outputs.is_prerelease != 'true'
        shell: bash
        env:
          TAG_NAME: ${{ needs.preparation.outputs.tag }}
          VERSION: ${{ needs.preparation.outputs.version }}
          RELEASE_BODY: ${{ needs.preparation.outputs.changelog }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$RELEASE_BODY" \
            --arg pub_date "$PUB_DATE" \
            '{version:$version,notes:$notes,pub_date:$pub_date,platforms:{}}' > latest.json

          for meta in collected_artifacts/updater_metadata/*.txt; do
            [ -f "$meta" ] || continue

            PLATFORM_KEY=$(basename "$meta" .txt)
            ASSET_NAME=$(tr -d '\r\n' < "$meta")
            SIGNATURE_FILE="collected_artifacts/upload_dist/${ASSET_NAME}.sig"

            if [ ! -f "$SIGNATURE_FILE" ]; then
              echo "Missing updater signature for $ASSET_NAME"
              exit 1
            fi

            SIGNATURE=$(tr -d '\r\n' < "$SIGNATURE_FILE")
            ASSET_URL="https://github.com/${REPOSITORY}/releases/download/${TAG_NAME}/${ASSET_NAME}"
            TMP_JSON=$(mktemp)

            jq \
              --arg platform "$PLATFORM_KEY" \
              --arg url "$ASSET_URL" \
              --arg signature "$SIGNATURE" \
              '.platforms[$platform] = { url: $url, signature: $signature }' \
              latest.json > "$TMP_JSON"

            mv "$TMP_JSON" latest.json
          done

          jq -e '.platforms | length > 0' latest.json >/dev/null
          jq . latest.json

      - name: Upload latest.json
        if: needs.preparation.outputs.is_prerelease != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.preparation.outputs.tag }}
        run: gh release upload "$TAG_NAME" latest.json --clobber
