[package]
name = "tauri-plugin-documents"
version = "0.1.0"
edition = "2021"
publish = false
links = "tauri-plugin-documents"
description = "iOS document access for NyaMark: pickers, bookmarks, coordinated reads and writes, sharing."
license = "MIT"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", default-features = false }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
