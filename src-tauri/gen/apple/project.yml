name: NyaMark
options:
  bundleIdPrefix: best.lolicon.nyamark
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: NyaMark
      NYAMARK_BUNDLE_ID: best.lolicon.nyamark
      NYAMARK_DISPLAY_NAME: NyaMark
      PRODUCT_BUNDLE_IDENTIFIER: $(NYAMARK_BUNDLE_ID)
      DEVELOPMENT_TEAM: GT8RWXQ2U4
      CODE_SIGN_STYLE: Automatic
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  NyaMark_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: NyaMark_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: NyaMark_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        CFBundleDisplayName: $(NYAMARK_DISPLAY_NAME)
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        NSUbiquitousContainers:
          iCloud.best.lolicon.nyamark:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: NyaMark
            NSUbiquitousContainerSupportedFolderLevels: Any
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkdn, mdwn, mdtxt]
              public.mime-type: [text/markdown]
        NyaMarkAppGroup: group.best.lolicon.nyamark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: TaoScene
                UISceneDelegateClassName: TaoSceneDelegate
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.0.0
        CFBundleVersion: "0.0.0"
    entitlements:
      path: NyaMark_iOS/NyaMark_iOS.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.best.lolicon.nyamark]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.best.lolicon.nyamark]
        com.apple.security.application-groups: [group.best.lolicon.nyamark]
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
        # Avoid recursion between Tauri's debug stderr redirector and os_log.
        OS_ACTIVITY_MODE: disable
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - target: NyaMarkShare
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: bun tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  NyaMarkShare:
    type: app-extension
    platform: iOS
    deploymentTarget: 15.0
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: NyaMark
        CFBundleShortVersionString: 0.0.0
        CFBundleVersion: "0.0.0"
        NyaMarkAppGroup: group.best.lolicon.nyamark
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.best.lolicon.nyamark]
    settings:
      base:
        NYAMARK_BUNDLE_ID: best.lolicon.nyamark
        PRODUCT_BUNDLE_IDENTIFIER: $(NYAMARK_BUNDLE_ID).share
        PRODUCT_NAME: NyaMarkShare
        DEVELOPMENT_TEAM: GT8RWXQ2U4
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
  NyaMarkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../../../tests/ios
    settings:
      base:
        NYAMARK_BUNDLE_ID: best.lolicon.nyamark
        PRODUCT_BUNDLE_IDENTIFIER: $(NYAMARK_BUNDLE_ID).ui-tests
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: NyaMark_iOS
    dependencies:
      - target: NyaMark_iOS
    scheme:
      testTargets:
        - NyaMarkUITests
