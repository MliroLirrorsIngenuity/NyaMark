<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NyaMark Updater</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          "SF Pro Text",
          "Segoe UI",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #f7fafc;
        color: #17212b;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #121820;
          color: #edf3f8;
        }
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      main {
        width: min(320px, calc(100vw - 48px));
        display: grid;
        gap: 18px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.2;
        font-weight: 760;
      }

      p {
        min-height: 38px;
        margin: 0;
        color: #667085;
        font-size: 13px;
        line-height: 1.45;
      }

      @media (prefers-color-scheme: dark) {
        p {
          color: #a7b4c4;
        }
      }

      .progress {
        position: relative;
        height: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(77, 122, 143, 0.18);
      }

      .progress::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: inherit;
        background: #4d7a8f;
        animation: progress-slide 1.05s ease-in-out infinite;
      }

      .is-error .progress::before {
        background: #c55f5f;
        animation-play-state: paused;
      }

      @keyframes progress-slide {
        0% {
          transform: translateX(-110%);
        }
        50% {
          transform: translateX(80%);
        }
        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Updating...</h1>
      <p id="message">Preparing the update.</p>
      <div class="progress" aria-hidden="true"></div>
    </main>
    <script>
      const message = document.getElementById('message');
      const setMessage = (payload) => {
        if (!payload || typeof payload.message !== 'string') return;
        message.textContent = payload.message;
        document.body.classList.toggle('is-error', payload.error === true);
      };

      window.__TAURI__?.event
        ?.listen('nyamark-updater://status', (event) => setMessage(event.payload))
        .catch(() => {});
    </script>
  </body>
</html>
