[package]
name = "NyaMark"
version = "0.0.0-dev"
description = "A Modern Markdown editor based on Tauri v2 and Milkdown."
authors = ["MliroLirrorsIngenuity"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nyamark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
anyhow = "1.0.102"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
# Atomic document saves: write next to the target, then rename over it.
tempfile = "3"
# AI requests. Already in the tree through the updater, which also brings
# the ring provider; aws-lc would be a second TLS backend to build.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-util = "0.7"
url = "2"
base64 = "0.22"
# Sealing the ChatGPT tokens; already in the tree through rustls.
ring = "0.17"
# Search result pages. Already in the tree through tauri's build tools, so its
# html5ever and selectors come at no cost; scraper would bring second copies.
dom_query = { version = "0.27", default-features = false }
# Fetched pages in GBK, Shift_JIS and the like, by the charset they declare.
encoding_rs = "0.8"
# Workspace listing and search skip what .gitignore and hidden folders hide.
ignore = "0.4"
# The glob a workspace listing is filtered by; the matcher `ignore` uses.
globset = "0.4"
# Workspace search by the pattern the assistant gives.
regex = "1"
# Conversation folders are named by a hash of the document path.
sha2 = "0.10"
# MCP servers: the protocol, child processes and streamable HTTP.
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
# A stdio MCP server runs in its own process group (a job object on Windows),
# so the processes it starts stop with it. Already in the tree through rmcp.
process-wrap = { version = "10", default-features = false, features = ["tokio1", "kill-on-drop", "process-group", "creation-flags", "job-object"] }
# Timeouts, child processes and stderr for MCP servers. Already in the tree
# through tauri.
tokio = { version = "1", features = ["io-util", "net", "process", "sync", "time"] }
# Sign in with ChatGPT: OAuth with PKCE, sent through our own reqwest client
# so no second HTTP stack comes with it.
oauth2 = { version = "5", default-features = false, features = ["timing-resistant-secret-traits"] }
# The listener on 127.0.0.1 the browser comes back to after signing in.
# Already in the tree through reqwest.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(unix)'.dependencies]
# Finder tags and other extended attributes outlive an atomic save.
xattr = "1"
# Stops what is left of an MCP server's process group when the app quits.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Used to hook `applicationShouldTerminate:` so dock Quit / logout prompt for unsaved changes,
# to mark windows with unsaved changes as edited, and to colour a window before its page draws.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSAppearance", "NSApplication", "NSColor", "NSColorList", "NSResponder", "NSView", "NSWindow"] }
block2 = "0.6"
# The system's preferred languages pick the menu language before the webview loads.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSLocale", "NSString"] }
# Reads them by CLDR's likely subtags, as the webview's `Intl.Locale` does.
icu_locale = "2.2"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
# AI service keys go to the Windows credential manager or the Secret Service.
keyring = "4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
# process-wrap takes its creation flags as this version's type; CREATE_NO_WINDOW
# keeps an MCP server from opening a console window.
windows-process = { package = "windows", version = "0.62", features = ["Win32_System_Threading"] }

[lints.clippy]
# A panic aborts the release build (`panic = "abort"`), and every open
# window's unsaved edits go with it. Failures are returned as errors; the few
# that cannot happen carry an allow saying why.
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
